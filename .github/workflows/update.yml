name: Update Newcastle Spending Data

on:
  schedule:
    - cron: "0 6 5 * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas requests beautifulsoup4

      - name: Run scraper
        run: python scripts/download_latest.py

      - name: Merge datasets
        run: python scripts/merge.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Automated monthly update" || echo "No changes to commit"
          git push
